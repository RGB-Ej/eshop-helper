<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Orders, stock, customers and profit for small online shops.">
<meta name="theme-color" content="#1F5BD8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="E-shop Helper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>E-shop Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column on white and blue, sticky shop header, a blue receipt-style profit card, bottom tab bar, sheets slide up for every form. */
:root{
  --bg:#F3F7FE; --surface:#FFFFFF; --sunk:#E8EFFB; --ink:#0E1B33; --muted:#55637D; --line:#D6E0F0;
  --accent:#1F5BD8; --accent-ink:#FFFFFF; --accent-soft:#E1EBFD;
  --hero-bg:#1F5BD8; --hero-bg2:#1747B3; --hero-ink:#FFFFFF; --hero-muted:rgba(255,255,255,.78); --hero-line:rgba(255,255,255,.3); --hero-neg:#FFD0CA;
  --good:#16794A; --good-soft:#DCF1E5; --warn:#92620A; --warn-soft:#FBEFD6; --bad:#B4322D; --bad-soft:#F9E0DE; --info:#0B7A9C; --info-soft:#DCF1F7; --vip:#7A4DD8; --vip-soft:#ECE4FB;
  --scrim:rgba(8,20,48,.42); --shadow:0 1px 2px rgba(20,50,120,.06),0 10px 28px rgba(20,50,120,.08);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:14px; --col:600px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1222; --surface:#111C33; --sunk:#17243F; --ink:#E6EDFA; --muted:#93A3BF; --line:#24324F;
  --accent:#6B9DFF; --accent-ink:#071430; --accent-soft:#16294D;
  --hero-bg:#1C4FC4; --hero-bg2:#163C96; --hero-ink:#FFFFFF; --hero-muted:rgba(255,255,255,.75); --hero-line:rgba(255,255,255,.25); --hero-neg:#FFC2BA;
  --good:#4FC283; --good-soft:#12301F; --warn:#E3AA3E; --warn-soft:#382A10; --bad:#F2726A; --bad-soft:#3B1A19; --info:#4CC3E3; --info-soft:#0F2E3A; --vip:#B79BFF; --vip-soft:#261C47;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1222; --surface:#111C33; --sunk:#17243F; --ink:#E6EDFA; --muted:#93A3BF; --line:#24324F;
  --accent:#6B9DFF; --accent-ink:#071430; --accent-soft:#16294D;
  --hero-bg:#1C4FC4; --hero-bg2:#163C96; --hero-ink:#FFFFFF; --hero-muted:rgba(255,255,255,.75); --hero-line:rgba(255,255,255,.25); --hero-neg:#FFC2BA;
  --good:#4FC283; --good-soft:#12301F; --warn:#E3AA3E; --warn-soft:#382A10; --bad:#F2726A; --bad-soft:#3B1A19; --info:#4CC3E3; --info-soft:#0F2E3A; --vip:#B79BFF; --vip-soft:#261C47;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.amt{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:40px;height:40px;display:inline-grid;place-items:center;padding:0 10px;font-weight:600;font-size:14px}
.icon-btn:hover{border-color:var(--accent)}

h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:18px}
h3{font-size:15px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none;font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* month switcher */
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month strong{font-family:var(--f-display);font-weight:600;font-size:16px}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* receipt hero */
.receipt{background:linear-gradient(160deg,var(--hero-bg),var(--hero-bg2));color:var(--hero-ink);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 16px;position:relative}
.receipt .eyebrow{color:var(--hero-muted)}
.receipt .big{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,9vw,44px);line-height:1.05;letter-spacing:-.01em;margin-top:4px}
.receipt .big.neg{color:var(--hero-neg)}
.receipt .delta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12.5px}
.receipt .delta span{background:rgba(255,255,255,.16);border-radius:999px;padding:2px 10px;white-space:nowrap}
.rlines{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line);display:grid;gap:6px}
.receipt .rlines{border-top-color:var(--hero-line)}
.rline{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.rline span:first-child{color:var(--muted);min-width:0}
.receipt .rline span:first-child{color:var(--hero-muted)}
.rline .amt{font-weight:500;white-space:nowrap}
.rline.total{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:600}
.receipt .rline.total{border-top-color:var(--hero-line)}
.rline.total span:first-child{color:var(--ink)}
.receipt .rline.total span:first-child{color:var(--hero-ink)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:600;font-size:20px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .h{font-size:12.5px;color:var(--muted)}
.tile.warn .v{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis div{background:var(--sunk);border-radius:12px;padding:10px 6px;min-width:0}
.kpis b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis span{font-size:12px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-block}
.s-new{background:var(--info-soft);color:var(--info)}
.s-confirmed{background:var(--accent-soft);color:var(--accent)}
.s-shipped{background:var(--warn-soft);color:var(--warn)}
.s-delivered{background:var(--good-soft);color:var(--good)}
.s-returned{background:var(--bad-soft);color:var(--bad)}
.s-cancelled{background:var(--sunk);color:var(--muted)}
.c-new{color:var(--info)}.c-confirmed{color:var(--accent)}.c-shipped{color:var(--warn)}.c-delivered{color:var(--good)}.c-returned{color:var(--bad)}.c-cancelled{color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;width:100%}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--sunk)}
.row-main{flex:1;min-width:0}
.row-main strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main .sub{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row-end .amt{font-weight:600}
.ono{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.flag{font-size:11.5px;font-weight:600;color:var(--warn)}
.stockbadge{font-family:var(--f-mono);font-size:12.5px;border-radius:8px;padding:2px 8px;background:var(--sunk)}
.stockbadge.low{background:var(--warn-soft);color:var(--warn)}
.stockbadge.out{background:var(--bad-soft);color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.searchbar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.searchbar input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

.banner{background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.link{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.welcome h1{font-size:clamp(24px,6.5vw,30px);line-height:1.2}
.welcome p{color:var(--muted);margin:8px 0 0;max-width:46ch}
.steps{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;flex:none}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .b-sales{fill:var(--accent-soft)}
.chart .b-net{fill:var(--accent)}
.chart .b-neg{fill:var(--bad)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart text.cur{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger,.btn[data-armed="1"]{color:var(--bad);border-color:var(--bad)}
.btn[data-armed="1"]{background:var(--bad-soft)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

/* nav + fab */
.nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);font-size:11.5px;font-weight:500}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.1}
.fab{position:fixed;z-index:7;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc((100vw - var(--col)) / 2 + 16px));height:52px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px 0 14px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
[dir="rtl"] .fab{padding:0 14px 0 18px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:var(--col);max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-6px;background:var(--bg);padding-block:6px 10px;z-index:1}
form{display:flex;flex-direction:column;gap:12px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-family:var(--f-display);font-weight:600;font-size:14px;padding:0 6px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.f input,.f select,.f textarea,.irow input,.irow select,textarea.code{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:44px;padding:0 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.f textarea,textarea.code{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
textarea.code{font-family:var(--f-mono);font-size:12.5px;min-height:110px;background:var(--sunk)}
.f input:focus,.f select:focus,.f textarea:focus,.irow input:focus,.irow select:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer}
.seg input:checked+span{border-color:transparent}
.seg.s-new input:checked+span{background:var(--info-soft);color:var(--info);box-shadow:inset 0 0 0 1.5px var(--info)}
.seg.s-confirmed input:checked+span{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg.s-shipped input:checked+span{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.seg.s-delivered input:checked+span{background:var(--good-soft);color:var(--good);box-shadow:inset 0 0 0 1.5px var(--good)}
.seg.s-returned input:checked+span{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.seg.s-cancelled input:checked+span{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--muted)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ihead,.irow{display:grid;grid-template-columns:minmax(0,1fr) 58px 86px 36px;gap:6px;align-items:center}
.ihead{font-size:12px;color:var(--muted);font-weight:500}
.irow select{padding:0 8px}
.irow input{padding:0 8px;text-align:center}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;color:var(--muted)}
.totals{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.wa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.wa pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.tab{position:relative}
.badge{position:absolute;top:3px;inset-inline-start:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.attn{border:1px solid var(--warn);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.attn-head{background:var(--warn-soft);color:var(--warn);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.attn-head h3{color:var(--warn)}
.attn .list{border:0;border-radius:0}
.reason{display:block;font-size:12.5px;color:var(--warn);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest{font-size:12.5px;font-weight:600;border-radius:8px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.rep{font-size:12px;color:var(--accent);font-weight:600}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.statline div{background:var(--sunk);border-radius:10px;padding:8px 4px;min-width:0}
.statline b{display:block;font-family:var(--f-display);font-weight:600}
.statline span{font-size:11.5px;color:var(--muted)}
.sg{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;display:inline-block}
.sg-vip{background:var(--vip-soft);color:var(--vip)}
.sg-repeat{background:var(--accent-soft);color:var(--accent)}
.sg-new{background:var(--info-soft);color:var(--info)}
.sg-sleeping{background:var(--warn-soft);color:var(--warn)}
.sg-lead{background:var(--sunk);color:var(--muted)}
.sgs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.hb{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb .track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.hb .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.delta-up{color:var(--good)}.delta-down{color:var(--bad)}
.log{display:flex;flex-direction:column;gap:0;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.log-item{position:relative;padding:0 0 12px 14px;padding-inline:14px 0}
.log-item::before{content:"";position:absolute;inset-inline-start:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.log-item b{font-weight:600;font-size:13px}
.log-item .when{font-size:12px;color:var(--muted)}
.log-item p{margin:2px 0 0;font-size:14px;white-space:pre-wrap}
.addlog{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.addlog select,.addlog input{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;padding:0 10px;font-size:15px;min-width:0}
.due{color:var(--bad);font-weight:600}
details.tpl summary{cursor:pointer;font-weight:600;padding:4px 0}
details.tpl[open] summary{margin-bottom:8px}
</style>
</head>

function num(v){const s=String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace('٫','.').replace(/,/g,'').trim();const n=parseFloat(s);return isFinite(n)?n:0;}

function curLbl(){const c=(D.settings.currency||'EGP').trim();return L()==='ar'&&c.toUpperCase()==='EGP'?'ج.م':c;}

function money(n){return `<bdi class="amt">${fmt(n)} ${esc(curLbl())}</bdi>`;}
function moneyTxt(n){return `${fmt(n)} ${curLbl()}`;}
function compact(n){return new Intl.NumberFormat(loc(),{notation:'compact',maximumFractionDigits:1}).format(n);}
function dShort(s){if(!s)return '';const [y,m,d]=s.split('-').map(Number);return new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short'}).format(new Date(y,m-1,d));}
function monthName(ym,opt={month:'long',year:'numeric'}){const [y,m]=ym.split('-').map(Number);return new Intl.DateTimeFormat(loc(),opt).format(new Date(y,m-1,1));}
function shiftYM(ym,k){const [y,m]=ym.split('-').map(Number);return localISO(new Date(y,m-1+k,1)).slice(0,7);}

/* ---------- order math ---------- */
const oSub=o=>o.items.reduce((s,i)=>s+num(i.qty)*num(i.price),0);
const oCogs=o=>o.items.reduce((s,i)=>s+num(i.qty)*num(i.cost),0);
const oTotal=o=>oSub(o)-num(o.discount)+num(o.shipFee);
const oDelivProfit=o=>oSub(o)-num(o.discount)-oCogs(o)+num(o.shipFee)-num(o.courierCost);
function applyStock(o,sign){if(!o||!ACTIVE.includes(o.status))return;o.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock=num(p.stock)+sign*num(i.qty);});}
function monthStats(ym){
  const os=D.orders.filter(o=>ymOf(o.date)===ym);
  const del=os.filter(o=>o.status==='delivered'),ret=os.filter(o=>o.status==='returned');
  const sales=del.reduce((s,o)=>s+oSub(o)-num(o.discount),0);
  const cogs=del.reduce((s,o)=>s+oCogs(o),0);
  const ship=del.reduce((s,o)=>s+num(o.shipFee)-num(o.courierCost),0);
  const retLoss=ret.reduce((s,o)=>s+num(o.courierCost),0);
  const exp=D.expenses.filter(e=>ymOf(e.date)===ym).reduce((s,e)=>s+num(e.amount),0);
  const live=os.filter(o=>o.status!=='cancelled');
  const counts={};STATUSES.forEach(s=>counts[s]=os.filter(o=>o.status===s).length);
  return{os,sales,cogs,ship,retLoss,exp,net:sales-cogs+ship-retLoss-exp,count:live.length,aov:live.length?live.reduce((s,o)=>s+oTotal(o),0)/live.length:0,
    returnRate:(del.length+ret.length)?ret.length/(del.length+ret.length):0,counts};
}

/* ---------- automation ---------- */
function parseD(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);}
function daysSince(s){if(!s)return 0;const n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.round((n-parseD(s))/864e5));}
function alertOf(o){
  const A=D.settings.alerts||{},d=daysSince(o.statusAt||o.date);
  if(o.status==='new'&&d>=num(A.new))return{k:'al_new',d};
  if(o.status==='confirmed'&&d>=num(A.confirmed))return{k:'al_confirmed',d};
  if(o.status==='shipped'&&d>=num(A.shipped))return{k:'al_shipped',d};
  if(o.status==='delivered'&&!o.paid&&d>=num(A.cod))return{k:'al_cod',d};
  return null;
}
const lateOrders=()=>D.orders.map(o=>({o,a:alertOf(o)})).filter(x=>x.a).sort((a,b)=>b.a.d-a.a.d);
function sold30(pid){const since=localISO(new Date(Date.now()-30*864e5));let q=0;D.orders.forEach(o=>{if(o.date<since||o.status==='cancelled'||o.status==='returned')return;o.items.forEach(i=>{if(i.pid===pid)q+=num(i.qty);});});return q;}
function reorderInfo(p){
  const q=sold30(p.id),v=q/30,st=num(p.stock);
  const lead=(p.lead===''||p.lead==null)?num(D.settings.lead):num(p.lead),cover=num(D.settings.cover);
  const daysLeft=v>0?Math.max(0,st)/v:Infinity;
  const need=v>0?Math.max(1,Math.ceil(v*(lead+cover)-st)):0;
  const due=v>0?daysLeft<=lead+3:st<=num(p.low);
  return{q,v,daysLeft,need,due,lead};
}
function nextOcc(r,from){
  if(r.freq==='weekly'){const d=parseD(from);d.setDate(d.getDate()+7);return localISO(d);}
  const a=parseD(r.anchor).getDate(),f=parseD(from),y=f.getFullYear(),m=f.getMonth()+1;
  const dim=new Date(y,m+1,0).getDate();return localISO(new Date(y,m,Math.min(a,dim)));
}
function runRecurring(){
  const today=localISO();let added=0;
  (D.recurring||[]).forEach(r=>{let n=nextOcc(r,r.lastRun),g=0;
    while(n<=today&&g++<400){D.expenses.push({id:uid(),type:r.type,amount:r.amount,date:n,note:r.note,recurringId:r.id});r.lastRun=n;added++;n=nextOcc(r,n);}});
  if(added)persist();
}
function getTpl(st){return(D.settings.tpl&&D.settings.tpl[L()]&&D.settings.tpl[L()][st])||DEF_TPL[L()][st];}
function fillTpl(tpl,o){
  const c=cust(o.customerId)||{};
  const items=o.items.map(i=>`• ${fmt(i.qty,0)} × ${i.name} — ${moneyTxt(num(i.qty)*num(i.price))}`).join('\n');
  const map={name:(c.name||'').trim().split(/\s+/)[0],shop:D.settings.shop||t('myShop'),no:o.no,items,total:moneyTxt(oTotal(o)),delivery:moneyTxt(o.shipFee),discount:moneyTxt(o.discount),
    courier:o.courier||t('theCourier'),tracking:o.tracking||'—',address:c.city||'—',pay:t(o.paid?'waTotalPaid':'waTotalCOD',{v:moneyTxt(oTotal(o))})};
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m);
}

function chart(ym){
  const months=[];for(let k=5;k>=0;k--)months.push(shiftYM(ym,-k));
  const data=months.map(m=>{const s=monthStats(m);return{m,sales:s.sales,net:s.net};});
  const W=330,H=170,top=20,bot=22,ph=H-top-bot;
  const maxV=Math.max(1,...data.map(d=>Math.max(d.sales,d.net))),minV=Math.min(0,...data.map(d=>d.net));
  const y=v=>top+(maxV-v)/(maxV-minV)*ph,y0=y(0),bw=W/6;
  let g=`<line class="axis" x1="0" x2="${W}" y1="${y0}" y2="${y0}"/>`;
  data.forEach((d,i)=>{
    const cx=bw*i+bw/2,cur=d.m===ym;
    g+=`<rect class="b-sales" x="${cx-17}" y="${y(d.sales)}" width="20" height="${Math.max(0,y0-y(d.sales))}" rx="3"/>`;
    const ny=d.net>=0?y(d.net):y0,nh=Math.abs(y(d.net)-y0);
    g+=`<rect class="${d.net>=0?'b-net':'b-neg'}" x="${cx+5}" y="${ny}" width="12" height="${nh}" rx="2"/>`;
    if(d.sales)g+=`<text x="${cx-7}" y="${y(d.sales)-5}" text-anchor="middle" class="${cur?'cur':''}">${compact(d.sales)}</text>`;

function dailyChart(st,ym){

  const W=330,H=110,top=14,bot=18,ph=H-top-bot,max=Math.max(1,...vals),bw=W/dim,today=ymOf(localISO())===ym?new Date().getDate():0;
  let g=`<line class="axis" x1="0" x2="${W}" y1="${top+ph}" y2="${top+ph}"/>`,best=vals.indexOf(Math.max(...vals));
  vals.forEach((v,i)=>{const h=v/max*ph;g+=`<rect class="${v?'b-net':'b-sales'}" x="${i*bw+bw*.18}" y="${top+ph-Math.max(h,v?2:1.5)}" width="${bw*.64}" height="${Math.max(h,v?2:1.5)}" rx="1.5"/>`;});
  [1,8,15,22,dim].forEach(d=>{g+=`<text x="${(d-.5)*bw}" y="${H-4}" text-anchor="middle">${d}</text>`;});

  const off={new:0,confirmed:1,shipped:1,delivered:3,returned:5,cancelled:1};

/* ---------- utilities ---------- */
function done(msg){persist();closeSheet();render();toast(msg);}
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200);}
function copyText(txt,src){
  const fb=()=>{if(src){src.focus();src.select?.();}else{const r=document.createRange(),pre=document.createElement('textarea');pre.value=txt;document.body.appendChild(pre);pre.select();setTimeout(()=>pre.remove(),4000);}};
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),fb);}catch(e){fb();}
}
function arm(btn,msgKey,fn){
  if(btn.dataset.armed==='1'){fn();return;}
  btn.dataset.armed='1';btn.textContent=t(msgKey);
  setTimeout(()=>{if(btn.isConnected){btn.dataset.armed='';btn.textContent=btn.dataset.label;}},4000);
}
function setTab(k){ui.tab=k;try{localStorage.setItem(KEY+':tab',k);}catch(e){}render();try{window.scrollTo(0,0)}catch(e){};}
function validBackup(o){return o&&typeof o==='object'&&Array.isArray(o.products)&&Array.isArray(o.orders);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':setTab(b.dataset.k);break;
    case 'lang':D.settings.lang=L()==='ar'?'en':'ar';persist();render();break;
    case 'settings':settingsSheet();break;
    case 'close':closeSheet();break;
    case 'fab':({dashboard:()=>orderSheet(),orders:()=>orderSheet(),products:()=>productSheet(),customers:()=>customerSheet()}[ui.tab]||(()=>orderSheet()))();break;
    case 'newProduct':productSheet();break;
    case 'editProduct':productSheet(id);break;
    case 'editOrder':orderSheet(id);break;
    case 'editCustomer':customerSheet(id);break;
    case 'newExpense':expenseSheet();break;
    case 'editExpense':expenseSheet(id);break;
    case 'mprev':ui.month=shiftYM(ui.month,-1);render();break;
    case 'mnext':if(ui.month<ymOf(localISO())){ui.month=shiftYM(ui.month,1);render();}break;
    case 'filter':ui.of=b.dataset.s;ui.q='';setTab('orders');break;
    case 'of':ui.of=b.dataset.s;render();break;
    case 'addItem':{$('#irows').insertAdjacentHTML('beforeend',itemRow({pid:'',qty:1,price:null}));recalcOrder();break;}
    case 'rmItem':{const rows=$$('.irow');if(rows.length>1)b.closest('.irow').remove();else{$('[name=pid]',rows[0]).value='';$('[name=price]',rows[0]).value='';}recalcOrder();break;}
    case 'copy':{const src=$('#'+b.dataset.src);copyText(src.value??src.textContent,src.tagName==='TEXTAREA'?src:null);break;}
    case 'copyText':copyText(b.dataset.text);break;
    case 'cs':ui.cs=b.dataset.s;render();break;
    case 'delLog':arm(b,'delete',()=>{const c=cust(id);if(!c)return;c.log=(c.log||[]).filter(l=>l.id!==b.dataset.log);persist();$('#logBox').innerHTML=logHTML(c);toast(t('deleted'));});break;
    case 'addLog':{const c=cust(id),tx=$('#logText').value.trim();if(!c||!tx)break;(c.log=c.log||[]).push({id:uid(),date:localISO(),ts:Date.now(),type:$('#logType').value,text:tx});persist();$('#logText').value='';$('#logBox').innerHTML=logHTML(c);render();toast(t('saved'));break;}
    case 'followDone':{const c=cust(id);if(!c)break;(c.log=c.log||[]).push({id:uid(),date:localISO(),ts:Date.now(),type:'note',text:t('followDoneLog')+(c.followNote?': '+c.followNote:'')});c.followUp='';c.followNote='';persist();render();customerSheet(id);toast(t('followDoneLog'));break;}
    case 'waPick':{const o=D.orders.find(x=>x.id===id);if(o)$('#waBox').innerHTML=waInner(o,b.dataset.s);break;}
    case 'copyReorder':copyText(reorderText());break;
    case 'stopRule':arm(b,'stopConfirm',()=>{D.recurring=(D.recurring||[]).filter(r=>r.id!==id);persist();closeSheet();render();toast(t('stopped'));});break;
    case 'tplReset':TPL_ST.forEach(st=>{const el=document.getElementById('f-tpl_'+st);if(el)el.value=DEF_TPL[L()][st];});toast(t('tplResetDone'));break;
    case 'del':arm(b,'confirmDelete',()=>doDelete(b.closest('.sheet').querySelector('form')));break;
    case 'sample':D=makeSample();runRecurring();ui.month=ymOf(localISO());done(t('saved'));setTab('dashboard');break;
    case 'sampleArm':arm(b,'replaceConfirm',()=>{D=makeSample();runRecurring();ui.month=ymOf(localISO());done(t('saved'));setTab('dashboard');});break;
    case 'clearSample':{const s=Object.assign({},D.settings,{shop:''});D=blank();D.settings=s;persist();render();break;}
    case 'erase':arm(b,'eraseConfirm',()=>{const lang=D.settings.lang;D=blank();D.settings.lang=lang;done(t('erased'));});break;
    case 'download':{try{const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=`eshop-helper-backup-${localISO()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(err){}break;}
    case 'restore':{let o;try{o=JSON.parse($('#bkIn').value);}catch(err){}if(!validBackup(o)){toast(t('importBad'));break;}
      arm(b,'replaceConfirm',()=>{const bl=blank();D=Object.assign(bl,o,{settings:Object.assign(bl.settings,o.settings||{})});done(t('importDone'));});break;}
  }
});
function doDelete(f){
  const id=f.dataset.id;
  if(f.id==='orderForm'){const o=D.orders.find(x=>x.id===id);applyStock(o,+1);D.orders=D.orders.filter(x=>x.id!==id);}
  else if(f.id==='productForm')D.products=D.products.filter(x=>x.id!==id);
  else if(f.id==='customerForm'){if(D.orders.some(o=>o.customerId===id))return toast(t('hasOrders'));D.customers=D.customers.filter(x=>x.id!==id);}
  else if(f.id==='expenseForm')D.expenses=D.expenses.filter(x=>x.id!==id);
  done(t('deleted'));
}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='orderForm')saveOrder(f);
  else if(f.id==='productForm')saveProduct(f);
  else if(f.id==='customerForm')saveCustomer(f);
  else if(f.id==='expenseForm')saveExpense(f);
  else if(f.id==='settingsForm'){
    const S=D.settings,lg=L();S.tpl=S.tpl||{en:{},ar:{}};S.tpl[lg]=S.tpl[lg]||{};
    TPL_ST.forEach(st=>{const v=F(f,'tpl_'+st).value.replace(/\r/g,'');if(!v.trim()||v===DEF_TPL[lg][st])delete S.tpl[lg][st];else S.tpl[lg][st]=v;});
    S.alerts={new:num(F(f,'al_new').value),confirmed:num(F(f,'al_confirmed').value),shipped:num(F(f,'al_shipped').value),cod:num(F(f,'al_cod').value)};
    Object.assign(S,{shop:F(f,'shop').value.trim(),currency:F(f,'currency').value.trim()||'EGP',lowDefault:num(F(f,'lowDefault').value),lead:num(F(f,'lead').value),cover:num(F(f,'cover').value),vipAt:num(F(f,'vipAt').value),sleepDays:num(F(f,'sleepDays').value),lang:F(f,'lang').value});
    done(t('saved'));
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='oq'||el.id==='pq'||el.id==='cq'){ui[el.id]=el.value;const pos=el.selectionStart;render();const n=$('#'+el.id);n.focus();try{n.setSelectionRange(pos,pos);}catch(err){}return;}
  const pf=el.closest('#productForm');
  if(pf){if(['cost','price','stock'].includes(el.name))$('#pProfit').innerHTML=profitBox(F(pf,'cost').value,F(pf,'price').value,F(pf,'stock').value);return;}
  const f=el.closest('#orderForm');if(!f)return;
  if(el.name==='cname'){const c=D.customers.find(x=>x.name===el.value);if(c){if(!F(f,'cphone').value)F(f,'cphone').value=c.phone||'';if(!F(f,'ccity').value)F(f,'ccity').value=c.city||'';}}
  recalcOrder();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.name==='pid'&&el.closest('.irow')){const p=prod(el.value),row=el.closest('.irow');if(p){$('[name=price]',row).value=p.price;row.dataset.name=p.name;}recalcOrder();}
  if(el.id==='bkFile'&&el.files[0]){const rd=new FileReader();rd.onload=()=>{$('#bkIn').value=rd.result;};rd.readAsText(el.files[0]);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.sheet'))closeSheet();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){runRecurring();if(!$('.sheet'))render();}});

runRecurring();
render();
})();
</script>

</body>
</html>
